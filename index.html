<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">
<title>回声影廊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0c14;overflow:hidden;touch-action:none}
canvas{display:block;margin:auto}
.tip{
position:fixed;top:16px;left:50%;transform:translateX(-50%);
color:#b8b8d0;text-align:center;font-size:14px;
}
.btn-group{
position:fixed;top:48px;right:12px;
display:flex;flex-direction:column;gap:8px
}
button{
padding:8px 14px;
border:none;border-radius:12px;
background:#303048;color:#e8e8f0;
font-size:14px;
}
button:active{background:#484868}
.joy-area{
position:fixed;
left:30px;bottom:40px;
width:130px;height:130px;
border-radius:50%;
background:rgba(60,60,90,0.25);
}
.joy-stick{
position:absolute;
width:42px;height:42px;
border-radius:50%;
background:rgba(210,210,240,0.6);
left:50%;top:50%;
transform:translate(-50%,-50%);
}
</style>
</head>
<body>
<div class="tip">本体踩开关｜残影推动光影石块抵达光圈终点</div>
<canvas id="game"></canvas>
<div class="btn-group">
<button id="reset">重置关卡</button>
<button id="clearTrace">清除残影</button>
</div>
<div class="joy-area" id="joyArea">
<div class="joy-stick" id="joyStick"></div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const joyArea = document.getElementById("joyArea");
const joyStick = document.getElementById("joyStick");

function resize(){
canvas.width = Math.min(window.innerWidth,700);
canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

const PLAYER_SIZE = 22;
const BLOCK_SIZE = 36;
let player = {x:80,y:100,speed:3.4};
let traces = [];
let block = {x:240,y:260};
let goal = {x:530,y:550,r:30};
let switchOn = false;
let switchPos = {x:340,y:380};

let joyActive = false;
let joyVec = {dx:0, dy:0};
const joyRadius = joyArea.clientWidth / 2;

joyArea.addEventListener("touchstart",(e)=>{
joyActive = true;
updateJoystick(e.touches[0]);
})
window.addEventListener("touchmove",(e)=>{
if(!joyActive) return;
updateJoystick(e.touches[0]);
})
window.addEventListener("touchend",()=>{
joyActive = false;
joyVec.dx = 0;
joyVec.dy = 0;
joyStick.style.left = "50%";
joyStick.style.top = "50%";
})

function updateJoystick(touch){
const rect = joyArea.getBoundingClientRect();
let x = touch.clientX - rect.left - joyRadius;
let y = touch.clientY - rect.top - joyRadius;
const dist = Math.hypot(x,y);
if(dist > joyRadius){
x = x / dist * joyRadius;
y = y / dist * joyRadius;
}
joyStick.style.left = (joyRadius + x)+"px";
joyStick.style.top = (joyRadius + y)+"px";
joyVec.dx = x / joyRadius;
joyVec.dy = y / joyRadius;
}

document.getElementById('reset').onclick = ()=>{
player={x:80,y:100,speed:3.4};
block={x:240,y:260};
traces=[];
switchOn=false;
}
document.getElementById('clearTrace').onclick=()=>traces=[];

function update(){
if(joyVec.dx || joyVec.dy){
traces.push({x:player.x,y:player.y,alpha:0.38});
player.x += joyVec.dx * player.speed;
player.y += joyVec.dy * player.speed;
}

const distSwitch = Math.hypot(player.x-switchPos.x,player.y-switchPos.y);
if(distSwitch<32) switchOn=true;

traces.forEach(t=>{
const d = Math.hypot(t.x-block.x,t.y-block.y);
if(d<36){
let angle = Math.atan2(block.y-t.y,block.x-t.x);
block.x += Math.cos(angle)*1.05;
block.y += Math.sin(angle)*1.05;
}
})

const distGoal = Math.hypot(block.x-goal.x,block.y-goal.y);
if(distGoal<goal.r&&switchOn){
ctx.fillStyle="#e8e8f4";
ctx.font="26px sans-serif";
ctx.textAlign="center";
ctx.fillText("抵达回声终点",canvas.width/2,canvas.height/2);
return;
}
}

function render(){
ctx.fillStyle="#0c0c14";
ctx.fillRect(0,0,canvas.width,canvas.height);

traces.forEach(t=>{
ctx.beginPath();
ctx.arc(t.x,t.y,PLAYER_SIZE,0,Math.PI*2);
ctx.fillStyle=`rgba(172,162,224,${t.alpha})`;
ctx.fill();
})

ctx.fillStyle="#383862";
ctx.fillRect(block.x-BLOCK_SIZE/2,block.y-BLOCK_SIZE/2,BLOCK_SIZE,BLOCK_SIZE);
ctx.strokeStyle="#9292cc";
ctx.lineWidth=1.6;
ctx.strokeRect(block.x-BLOCK_SIZE/2,block.y-BLOCK_SIZE/2,BLOCK_SIZE,BLOCK_SIZE);

ctx.beginPath();
ctx.arc(switchPos.x,switchPos.y,24,0,Math.PI*2);
ctx.fillStyle = switchOn ? "#5c6ebb":"#262642";
ctx.fill();

ctx.beginPath();
ctx.arc(goal.x,goal.y,goal.r,0,Math.PI*2);
ctx.strokeStyle="#a2a2dd";
ctx.lineWidth=2;
ctx.stroke();

ctx.beginPath();
ctx.arc(player.x,player.y,PLAYER_SIZE,0,Math.PI*2);
ctx.fillStyle="#e0e0f4";
ctx.fill();
}

function loop(){
update();
render();
requestAnimationFrame(loop);
}
loop();
</script>
</body>
  </html>

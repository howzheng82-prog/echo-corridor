<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Echo Corridor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000}
canvas{display:block;width:100vw;height:100vh}

#rotateTip{
    display:flex;
    position:fixed;
    inset:0;
    background:#000;
    color:#fff;
    font-size:22px;
    z-index:9999;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
}
#rotateTip small{
    font-size:14px;
    opacity:0.7;
    margin-top:16px;
}

#mirrorEnterBtn{
    display:none;
    position:fixed;
    top:45%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:16px 32px;
    background:rgba(0,0,0,0.65);
    color:#ffffff;
    border:1px solid rgba(255,255,255,0.3);
    border-radius:14px;
    font-size:18px;
    z-index:999;
    opacity:0;
    transition:opacity 0.3s ease;
}
#mirrorEnterBtn.show{
    display:block;
    opacity:1;
}

#exitMirrorBtn{
    display:none;
    position:fixed;
    top:24px;
    right:24px;
    padding:12px 22px;
    background:rgba(120,20,40,0.6);
    color:#fff;
    border-radius:12px;
    font-size:16px;
    z-index:999;
    opacity:0;
    transition:opacity 0.3s ease;
}
#exitMirrorBtn.show{
    display:block;
    opacity:1;
}

#joystickBox{
    position:fixed;
    left:32px;
    bottom:32px;
    width:130px;
    height:130px;
    background:rgba(255,255,255,0.15);
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.25);
    touch-action:none;
    z-index:998;
}
#joystickDot{
    width:46px;
    height:46px;
    background:rgba(255,255,255,0.65);
    border-radius:50%;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}
#viewTouchArea{
    position:fixed;
    right:0;
    top:0;
    width:60vw;
    height:100vh;
    touch-action:none;
    z-index:990;
}
</style>
</head>
<body>
<div id="rotateTip">
    请横向握持手机
    <small>点击屏幕尝试自动横屏全屏</small>
</div>

<div id="mirrorEnterBtn">点击进入镜中世界</div>
<div id="exitMirrorBtn">离开镜中世界</div>
<div id="joystickBox">
    <div id="joystickDot"></div>
</div>
<div id="viewTouchArea"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const mirrorEnterBtn = document.getElementById('mirrorEnterBtn');
const exitMirrorBtn = document.getElementById('exitMirrorBtn');
const joystickBox = document.getElementById('joystickBox');
const joystickDot = document.getElementById('joystickDot');
const viewTouchArea = document.getElementById('viewTouchArea');
const rotateTip = document.getElementById('rotateTip');

let fullscreenLock = false;
// 点击画面触发全屏+横屏锁定
document.body.addEventListener('click',async ()=>{
    if(fullscreenLock) return;
    try{
        await document.documentElement.requestFullscreen();
        if(screen.orientation && screen.orientation.lock){
            await screen.orientation.lock('landscape');
        }
        fullscreenLock = true;
    }catch(e){
        console.log("浏览器不支持自动锁定横屏，手动旋转手机");
    }
})

let inMirrorScene = false;
let nearMirrorRange = false;
const mirrorDistanceTrigger = 3.8;

let stickVector = {x:0, y:0};
const stickMaxRadius = joystickBox.offsetWidth / 2 - 24;

function updateJoystick(clientX, clientY){
    const rect = joystickBox.getBoundingClientRect();
    let x = clientX - rect.left - rect.width/2;
    let y = clientY - rect.top - rect.height/2;
    const length = Math.hypot(x,y);
    if(length > stickMaxRadius){
        x = x / length * stickMaxRadius;
        y = y / length * stickMaxRadius;
    }
    joystickDot.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
    stickVector.x = x / stickMaxRadius;
    stickVector.y = y / stickMaxRadius;
}
function resetJoystick(){
    joystickDot.style.transform = "translate(-50%,-50%)";
    stickVector.x = 0;
    stickVector.y = 0;
}
joystickBox.addEventListener('touchstart',e=>{
    e.preventDefault();
    updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
})
joystickBox.addEventListener('touchmove',e=>{
    e.preventDefault();
    updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
})
joystickBox.addEventListener('touchend',resetJoystick);
joystickBox.addEventListener('touchcancel',resetJoystick);

let touchLastX = 0;
let yaw = 0;
const rotateSpeed = 0.0042;
viewTouchArea.addEventListener('touchstart',e=>{
    touchLastX = e.touches[0].clientX;
});
viewTouchArea.addEventListener('touchmove',e=>{
    const dx = e.touches[0].clientX - touchLastX;
    yaw += dx * rotateSpeed;
    touchLastX = e.touches[0].clientX;
});

let scene, camera, renderer, player;
let mirrorMesh;

function initGame(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111118);
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({
